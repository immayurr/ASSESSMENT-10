apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-dashboard-deployment
  labels:
    app: energy-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: energy-dashboard
  template:
    metadata:
      labels:
        app: energy-dashboard
    spec:
      containers:
      - name: energy-dashboard
        image: mayur123987/smart-campus-energy:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: energy-dashboard-service
spec:
  type: NodePort
  selector:
    app: energy-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
